{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block login %}
<div class="login">
  <div class="izq">
    <h1>Control de asistencias, pagos y finanzas</h1>
    <p>Un solo lugar para llevar a sus socios, las cuotas mensuales, los recibos y las cuentas de la organización.</p>
  </div>
  <div class="der">
    <form method="post">
      <div class="logo" style="background:linear-gradient(135deg,#4ade80,#15803d);display:grid;place-items:center;color:#fff">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/><circle cx="16" cy="13.5" r="1.2"/></svg>
      </div>
      <h2 style="font-size:24px;margin-bottom:4px">Bienvenido</h2>
      <p style="color:#6b7a72;margin:0 0 22px">{{ org }}</p>
      <label>Usuario</label><input name="usuario" required autofocus>
      <label>Contraseña</label><input name="clave" type="password" required>
      <button class="btn" style="width:100%;justify-content:center;padding:12px">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
